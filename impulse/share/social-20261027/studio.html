<!doctype html><html lang="en"><meta charset="utf-8"><title>RoadsterLAB publication studio</title><link rel="stylesheet" href="style.css"><style>
*{box-sizing:border-box}body{margin:0;background:#09171a;color:#eef5ef;font-family:Arial,sans-serif;min-width:1920px}.board{max-width:none;margin:0;width:1920px;height:1080px;padding:40px 48px;background:radial-gradient(ellipse at 85% 0%,#1b3c33,#0b181c 60%);position:relative}.brand{font-size:76px;font-weight:700;letter-spacing:-3px;line-height:1}.brand span{color:#a6dfc9}.top{display:flex;align-items:center;justify-content:space-between}.tag{font:17px Consolas,monospace;letter-spacing:3px;color:#a7c8b7}h1{font-size:44px;font-weight:500;letter-spacing:-1px;margin:26px 0 10px}.subtitle{font-size:21px;color:#a5c3b7;margin:0 0 24px}.hero{display:grid;grid-template-columns:830px 1fr;gap:40px;height:310px;margin-bottom:22px}.hero canvas{width:830px;height:310px;border:1px solid #a6dfc944;border-radius:8px}.hero-note{padding:12px 0}.hero-note h2{font-size:27px;font-weight:400;margin:5px 0 20px}.metrics{display:flex;gap:50px}.metric label{display:block;color:#a5c3b7;font:15px Consolas,monospace;margin-bottom:12px}.metric strong{font-size:48px;font-weight:400;color:#c6e5ce}.metric small{display:block;color:#a5c3b7;font-size:17px;margin-top:10px}.hero-note p{color:#a7c6b8;font-size:19px;line-height:1.55;max-width:850px}#plots .kinematic-panels{grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}#plots .inspection-bar{display:none}#plots .kinematic-card{padding:20px 20px 14px;background:#12252a;min-height:350px;border:1px solid #a6dfc930;border-radius:8px}#plots .kinematic-card header{display:flex;align-items:center;min-height:60px;margin-bottom:10px}#plots .kinematic-card header small{font:12px Consolas,monospace;letter-spacing:1px}#plots .kinematic-card h3{font-size:26px;margin-top:8px}#plots .kinematic-card output{font-size:24px}#plots .kinematic-card svg{height:210px}#plots .kinematic-card svg text.axis-label{font-size:12px;fill:#abc4c9}#plots .kinematic-card svg text.boost-label{font-size:10px;fill:#d8b89b}#plots .plot-readouts{padding-top:14px}#plots .plot-readouts s
